# =============================================================================
# gpg-agent.conf — GPG agent with SSH support
# Placed at ~/.gnupg/gpg-agent.conf by sync-secrets.sh
# =============================================================================
enable-ssh-support
default-cache-ttl 600
max-cache-ttl 7200
default-cache-ttl-ssh 600
max-cache-ttl-ssh 7200
pinentry-program /usr/bin/pinentry-tty
