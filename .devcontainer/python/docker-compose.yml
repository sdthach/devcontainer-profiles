services:
  devcontainer:
    extends:
      file: ../base/docker-compose.base.yml
      service: devcontainer
    volumes:
      - devcontainer-pip-cache:/home/vscode/.cache/pip

volumes:
  devcontainer-pip-cache:
    external: true
  devcontainer-mise-cache:
    external: true
  devcontainer-go-cache:
    external: true
  devcontainer-cargo-cache:
    external: true
  devcontainer-pnpm-cache:
    external: true
  devcontainer-docker-data:
    external: true
