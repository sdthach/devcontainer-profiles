# =============================================================================
# .tmux.conf — tmux configuration with TPM plugins
# =============================================================================

# --- Terminal settings ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# --- Prefix key ---
# Keep default Ctrl-b (override if preferred)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# --- Split panes with intuitive keys ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# --- Navigate panes with Alt+arrow ---
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- Status bar ---
set -g status-position bottom
set -g status-interval 2
set -g status-left-length 30
set -g status-right-length 80
set -g status-right '#[fg=green]#($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load --colors --interval 2)#[default] | %H:%M '

# =============================================================================
# TPM — Tmux Plugin Manager
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'thewtex/tmux-mem-cpu-load'

# --- Plugin settings ---
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @logging-path '~/.tmux/logs'

# --- Initialize TPM (keep this line at the very bottom) ---
run '~/.tmux/plugins/tpm/tpm'
